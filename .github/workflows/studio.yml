name: MLX Studio

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: DMG flavour (sequoia = macOS 14.5+, tahoe = macOS 26 only)
        type: choice
        options: [sequoia, tahoe]
        default: sequoia
      jang_ref:
        description: jjang-ai/jangq ref whose jang-tools are bundled
        required: true
        default: main
      release:
        description: Publish this build as v<package version> (creates the tag and the GitHub release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Typecheck and test the app
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails on any failure except the pre-existing upstream ones listed in
      # tests/known-upstream-failures.json.
      - name: Unit tests
        run: node scripts/vitest-ci.mjs

  dmg:
    name: Build the DMG
    needs: panel
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MLX_STUDIO_FLAVOR: ${{ inputs.flavor || 'sequoia' }}
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: studio

      - name: Check out JANG tools (bundled into the engine runtime)
        uses: actions/checkout@v4
        with:
          repository: jjang-ai/jangq
          ref: ${{ inputs.jang_ref || 'main' }}
          path: jangq
          persist-credentials: false

      - name: Homebrew node (the packaging hooks call /opt/homebrew/bin/node)
        run: |
          if [[ ! -x /opt/homebrew/bin/node || ! -x /opt/homebrew/bin/npx ]]; then
            brew install node
          fi
          /opt/homebrew/bin/node --version

      - name: Install dependencies
        working-directory: studio/panel
        run: /opt/homebrew/bin/npm ci

      # MLX Studio carries MLX Node (app.mlx.mac) and installs it on first run.
      # Download the public notarized build, check it (bundle id, team, strict
      # signature, Gatekeeper) and stage it in panel/resources/bundled-node.
      # Release (tag) builds fail without it; manual builds warn and go on.
      - name: Bundle MLX Node
        working-directory: studio/panel
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if ./scripts/fetch-mlx-node.sh; then exit 0; fi
          rm -rf resources/bundled-node
          if [[ "$GITHUB_REF" == refs/tags/v* || "$RELEASE" == "true" ]]; then
            echo "::error::Couldn't fetch or verify MLX Node from mlx.app; a release must carry it."
            exit 1
          fi
          echo "::warning::Couldn't fetch or verify MLX Node; this DMG is built without it (the app offers the download instead)."

      # Optional Developer ID signing (electron-builder reads CSC_LINK and
      # CSC_KEY_PASSWORD) and notarisation (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD).
      # Without MAC_CERT_P12 the DMG is unsigned and nothing is notarized.
      # Import the Developer ID identity into a keychain of our own (electron-builder's temporary keychain fails
      # set-key-partition-list on the macos-26 runners) and let electron-builder find it there by name.
      - name: Signing certificate
        if: env.MAC_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/cert.p12"
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" && security import "$RUNNER_TEMP/$ca.cer" -k "$KC" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(Developer ID Application: [^"]+)".*/\1/')
          [ -n "$ID" ] || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "Signing as: $ID"
          echo "CSC_NAME=${ID#Developer ID Application: }" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"

      - name: Build DMG
        working-directory: studio/panel
        env:
          VMLX_JANG_TOOLS_SOURCE: ${{ github.workspace }}/jangq/jang-tools
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build-studio-dmg.sh

      - name: Notarize and staple the DMG
        if: env.MAC_CERT_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != ''
        working-directory: studio/panel/release
        run: |
          team="${APPLE_TEAM_ID:-CCKXS9W488}"
          for dmg in MLX-Studio-*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$team" --wait
            xcrun stapler staple "$dmg"
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done

      # The carried MLX Node must come out of the final DMG still valid.
      - name: Check MLX Node in the DMG
        if: hashFiles('studio/panel/resources/bundled-node/MLX Node.zip') != ''
        working-directory: studio/panel/release
        run: |
          REQ='anchor apple generic and certificate leaf[subject.OU] = "CCKXS9W488" and identifier "app.mlx.mac"'
          for dmg in MLX-Studio-*.dmg; do
            mnt="$(mktemp -d)"; out="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" > /dev/null
            zip="$mnt/MLX Studio.app/Contents/Resources/bundled-node/MLX Node.zip"
            test -f "$zip" || { echo "::error::$dmg doesn't carry MLX Node"; hdiutil detach "$mnt" -force; exit 1; }
            if [[ -n "$MAC_CERT_P12" ]]; then codesign --verify --deep --strict "$mnt/MLX Studio.app"; fi
            ditto -x -k "$zip" "$out"
            codesign --verify --deep --strict -R "=$REQ" "$out/MLX Node.app"
            echo "$dmg carries MLX Node $(plutil -extract CFBundleShortVersionString raw -o - "$out/MLX Node.app/Contents/Info.plist")"
            hdiutil detach "$mnt" -quiet
            rm -rf "$out"
          done

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: MLX-Studio-${{ github.ref_name }}-${{ env.MLX_STUDIO_FLAVOR }}
          path: |
            studio/panel/release/MLX-Studio-*.dmg
            studio/panel/release/MLX-Studio-*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else echo "TAG=v$(node -p "require('./panel/package.json').version")" >> "$GITHUB_ENV"; fi

      - uses: actions/download-artifact@v4
        with:
          name: MLX-Studio-${{ github.ref_name }}-sequoia
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          ls -la dist
          gh release create "$TAG" dist/MLX-Studio-*.dmg dist/MLX-Studio-*.dmg.sha256 --target "$GITHUB_SHA" \
            --title "MLX Studio $VERSION" \
            --notes "MLX Studio $VERSION for Apple silicon Macs (macOS 14.5 or later). Signed with Developer ID and notarized by Apple. Carries MLX Node inside and offers to install it on first run. Built on vMLX by JANGQ AI (Apache License 2.0)."

      - name: Point the update feed at it
        env:
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          DMG="$(cd dist && ls MLX-Studio-*.dmg | head -1)"
          SHA="$(cut -d' ' -f1 "dist/$DMG.sha256")"
          URL="https://github.com/$REPO/releases/download/$TAG/$DMG"
          node -e '
            const fs = require("fs");
            const [v, url, sha, size] = process.argv.slice(1);
            const m = { version: v, url, sha256: sha, size: Number(size), date: new Date().toISOString().slice(0, 10),
              downloads: { sequoia: { url, sha256: sha } },
              notes: `MLX Studio ${v}. Signed and notarized. Carries MLX Node inside.` };
            fs.writeFileSync("latest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION" "$URL" "$SHA" "$(stat -c %s "dist/$DMG")"
          cat latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "latest.json: MLX Studio $VERSION"
          git push origin HEAD:main
