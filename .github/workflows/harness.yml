name: MLX Harness

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: DMG flavour (sequoia = macOS 14.5+, tahoe = macOS 26 only)
        type: choice
        options: [sequoia, tahoe]
        default: sequoia
      jang_ref:
        description: jjang-ai/jangq ref whose jang-tools are bundled
        required: true
        default: main
      release:
        description: Publish this build as v<package version> (creates the tag and the GitHub release)
        type: boolean
        default: false
      notes:
        description: One line shown to users in the app's update banner and notification (optional)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Typecheck and test the app
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails on any failure except the pre-existing upstream ones listed in
      # tests/known-upstream-failures.json.
      - name: Unit tests
        run: node scripts/vitest-ci.mjs

      # The Workspace sandbox on this Mac: builds the profile the app builds and
      # proves that ordinary commands (shell, git, node, python) still run under
      # it, and that what it refuses is refused: writes outside the working
      # folder, credential folders and the app's data, git hooks and config,
      # the app's own local ports, LaunchServices and Apple Events.
      - name: Seatbelt probe
        env:
          MLX_SEATBELT_PROBE: "1"
        run: npx --no-install vitest run tests/seatbelt-macos-probe.test.ts

  dmg:
    name: Build the DMG
    needs: panel
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MLX_HARNESS_FLAVOR: ${{ inputs.flavor || 'sequoia' }}
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: harness

      - name: Check out JANG tools (bundled into the engine runtime)
        uses: actions/checkout@v4
        with:
          repository: jjang-ai/jangq
          ref: ${{ inputs.jang_ref || 'main' }}
          path: jangq
          persist-credentials: false

      - name: Homebrew node (the packaging hooks call /opt/homebrew/bin/node)
        run: |
          if [[ ! -x /opt/homebrew/bin/node || ! -x /opt/homebrew/bin/npx ]]; then
            brew install node
          fi
          /opt/homebrew/bin/node --version

      - name: Install dependencies
        working-directory: harness/panel
        run: /opt/homebrew/bin/npm ci

      # MLX Harness carries MLX Node (app.mlx.mac) and installs it on first run.
      # Download the public notarized build, check it (bundle id, team, strict
      # signature, Gatekeeper) and stage it in panel/resources/bundled-node.
      # Release (tag) builds fail without it; manual builds warn and go on.
      - name: Bundle MLX Node
        working-directory: harness/panel
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if ./scripts/fetch-mlx-node.sh; then exit 0; fi
          rm -rf resources/bundled-node
          if [[ "$GITHUB_REF" == refs/tags/v* || "$RELEASE" == "true" ]]; then
            echo "::error::Couldn't fetch or verify MLX Node from mlx.app; a release must carry it."
            exit 1
          fi
          echo "::warning::Couldn't fetch or verify MLX Node; this DMG is built without it (the app offers the download instead)."

      # Optional Developer ID signing (electron-builder reads CSC_LINK and
      # CSC_KEY_PASSWORD) and notarisation (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD).
      # Without MAC_CERT_P12 the DMG is unsigned and nothing is notarized.
      # Import the Developer ID identity into a keychain of our own (electron-builder's temporary keychain fails
      # set-key-partition-list on the macos-26 runners) and let electron-builder find it there by name.
      - name: Signing certificate
        if: env.MAC_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/cert.p12"
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" && security import "$RUNNER_TEMP/$ca.cer" -k "$KC" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(Developer ID Application: [^"]+)".*/\1/')
          [ -n "$ID" ] || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "Signing as: $ID"
          echo "CSC_NAME=${ID#Developer ID Application: }" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"

      - name: Build DMG
        working-directory: harness/panel
        env:
          VMLX_JANG_TOOLS_SOURCE: ${{ github.workspace }}/jangq/jang-tools
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # signing walks tens of thousands of files in the bundled Python; the runner's default limit (256) runs out (EMFILE)
          sudo launchctl limit maxfiles 65536 200000 || true
          ulimit -n 65536 || ulimit -n 10240 || true
          echo "open files: $(ulimit -n)"
          ./scripts/build-harness-dmg.sh

      - name: Notarize and staple the DMG
        if: env.MAC_CERT_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != ''
        working-directory: harness/panel/release
        run: |
          team="${APPLE_TEAM_ID:-CCKXS9W488}"
          for dmg in MLX-Harness-*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$team" --wait
            xcrun stapler staple "$dmg"
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done

      # The carried MLX Node must come out of the final DMG still valid.
      - name: Check MLX Node in the DMG
        if: hashFiles('harness/panel/resources/bundled-node/MLX Node.zip') != ''
        working-directory: harness/panel/release
        run: |
          REQ='anchor apple generic and certificate leaf[subject.OU] = "CCKXS9W488" and identifier "app.mlx.mac"'
          for dmg in MLX-Harness-*.dmg; do
            mnt="$(mktemp -d)"; out="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" > /dev/null
            zip="$mnt/MLX Harness.app/Contents/Resources/bundled-node/MLX Node.zip"
            test -f "$zip" || { echo "::error::$dmg doesn't carry MLX Node"; hdiutil detach "$mnt" -force; exit 1; }
            if [[ -n "$MAC_CERT_P12" ]]; then codesign --verify --deep --strict "$mnt/MLX Harness.app"; fi
            ditto -x -k "$zip" "$out"
            codesign --verify --deep --strict -R "=$REQ" "$out/MLX Node.app"
            echo "$dmg carries MLX Node $(plutil -extract CFBundleShortVersionString raw -o - "$out/MLX Node.app/Contents/Info.plist")"
            hdiutil detach "$mnt" -quiet
            rm -rf "$out"
          done

      # Launch the app from the final DMG and run its self-test (window and
      # preload IPC, memory and task stores, the agent browser in its own
      # session, the MLX Node yield watcher, the install window and a real
      # copy through Install's checks). A failed launch fails the build.
      # The DMG holds just the app at its root (the app is its own installer;
      # the in-app updater finds "MLX Harness.app" there).
      - name: Launch the app (self-test)
        working-directory: harness/panel/release
        run: |
          for dmg in MLX-Harness-*.dmg; do
            mnt="$(mktemp -d)"; run="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" > /dev/null
            test -d "$mnt/MLX Harness.app" || { echo "::error::$dmg has no MLX Harness.app at its root"; hdiutil detach "$mnt" -force; exit 1; }
            if [[ -e "$mnt/Applications" || -L "$mnt/Applications" ]]; then echo "::error::$dmg still has an Applications link"; hdiutil detach "$mnt" -force; exit 1; fi
            ls -la "$mnt"
            ditto "$mnt/MLX Harness.app" "$run/MLX Harness.app"
            hdiutil detach "$mnt" -quiet
            code=0
            perl -e 'alarm 330; exec @ARGV' "$run/MLX Harness.app/Contents/MacOS/MLX Harness" \
              --vmlx-user-data-dir="$run/user-data" --mlx-self-test="$run/report.json" > "$run/log.txt" 2>&1 || code=$?
            grep -E '\[SELFTEST\]' "$run/log.txt" || tail -50 "$run/log.txt"
            test -f "$run/report.json" && cat "$run/report.json"
            if [[ "$code" != "0" ]]; then echo "::error::$dmg: the app's self-test failed (exit $code)"; exit 1; fi
            rm -rf "$run"
          done

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: MLX-Harness-${{ github.ref_name }}-${{ env.MLX_HARNESS_FLAVOR }}
          path: |
            harness/panel/release/MLX-Harness-*.dmg
            harness/panel/release/MLX-Harness-*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else echo "TAG=v$(node -p "require('./panel/package.json').version")" >> "$GITHUB_ENV"; fi

      - uses: actions/download-artifact@v4
        with:
          name: MLX-Harness-${{ github.ref_name }}-sequoia
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          ls -la dist
          gh release create "$TAG" dist/MLX-Harness-*.dmg dist/MLX-Harness-*.dmg.sha256 --target "$GITHUB_SHA" \
            --title "MLX Harness $VERSION" \
            --notes "MLX Harness $VERSION for Apple silicon Macs (macOS 14.5 or later). Signed with Developer ID and notarized by Apple. Open MLX Harness from the disk image and it installs itself in Applications. Carries MLX Node inside and offers to install it on first run. Built on vMLX by JANGQ AI (Apache License 2.0)."

      - name: Point the update feed at it
        env:
          REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
        run: |
          VERSION="${TAG#v}"
          DMG="$(cd dist && ls MLX-Harness-*.dmg | head -1)"
          SHA="$(cut -d' ' -f1 "dist/$DMG.sha256")"
          # github.repository is MLXapp/harness. Installed copies trust any HTTPS
          # github.com download (host check only), so every released version
          # accepts this URL.
          URL="https://github.com/$REPO/releases/download/$TAG/$DMG"
          node -e '
            const fs = require("fs");
            const [v, url, sha, size] = process.argv.slice(1);
            const m = { version: v, url, sha256: sha, size: Number(size), date: new Date().toISOString().slice(0, 10),
              downloads: { sequoia: { url, sha256: sha } },
              notes: process.env.NOTES || `MLX Harness ${v}. Signed and notarized. Carries MLX Node inside.` };
            fs.writeFileSync("latest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION" "$URL" "$SHA" "$(stat -c %s "dist/$DMG")"
          cat latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "latest.json: MLX Harness $VERSION"
          git push origin HEAD:main
