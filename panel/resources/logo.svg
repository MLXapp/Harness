<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MLX Studio app icon: the MLX X (Material Design Icons "alpha-x", Pictogrammers,
       Apache 2.0) in the MLX brand gradient (ink to orange) on a white rounded square
       (macOS icon grid: 824 px body). Same X as mlx.app/brand/logos/x/mlx-x-gradient-light.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1f4"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <!-- the MLX X (MDI alpha-x), 7×11 units -->
  <g transform="translate(512 512) scale(48) translate(-12 -12)">
    <path fill="url(#x)" d="M9,7L11,12L9,17H11L12,14.5L13,17H15L13,12L15,7H13L12,9.5L11,7H9Z"/>
  </g>
</svg>
