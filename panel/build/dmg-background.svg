<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380">
  <!-- MLX Harness DMG window background (0.5.5+): the app is its own installer,
       so the window holds just the app (icon centre x 280, y 160, 96 px; Finder
       draws its name below) and asks you to open it. Aluminum, a soft orange
       glow under the icon, type in Inter (SF Pro can't be embedded). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F6F8"/>
      <stop offset="1" stop-color="#E4E6EB"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#8CAADC" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8CAADC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="1" r="0.7">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFB85C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="280" cy="166" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9F0A" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FF9F0A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF9F0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D1D1F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F08A00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1D1D1F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="560" height="380" fill="url(#bg)"/>
  <rect width="560" height="380" fill="url(#glowA)"/>
  <rect width="560" height="380" fill="url(#glowB)"/>
  <circle cx="280" cy="166" r="96" fill="url(#halo)"/>
  <rect x="250" y="268" width="60" height="1.5" rx="0.75" fill="url(#rule)"/>
  <text x="280" y="302" text-anchor="middle" font-family="Inter Display, Inter, -apple-system, Helvetica Neue, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.2" fill="#1D1D1F">Open MLX Harness to install</text>
  <text x="280" y="327" text-anchor="middle" font-family="Inter, -apple-system, Helvetica Neue, sans-serif" font-size="12.5" font-weight="400" fill="#565B66">Double-click it, then click Install.</text>
</svg>
