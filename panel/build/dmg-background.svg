<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
  <!-- MLX Harness DMG window background: aluminum, a soft orange glow, and an
       arrow from the app (x 160) to Applications (x 600) at icon height 220. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5F7"/>
      <stop offset="1" stop-color="#E2E5EA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#8CAADC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8CAADC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB85C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="300" y1="220" x2="452" y2="220">
      <stop offset="0" stop-color="#1D1D1F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F08A00" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="760" height="460" fill="url(#bg)"/>
  <rect width="760" height="460" fill="url(#glowA)"/>
  <rect width="760" height="460" fill="url(#glowB)"/>
  <g fill="none" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 220 H450"/>
    <path d="M432 204 L452 220 L432 236"/>
  </g>
</svg>
